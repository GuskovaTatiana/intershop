server:
  port: 8009
spring:
  application:
    name: payment-service
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8007}/realms/ecommerce-realm
payment:
  balance:
    amount:
      default: 20000
