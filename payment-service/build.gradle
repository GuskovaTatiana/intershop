plugins {
    id 'org.springframework.boot'
    id 'org.openapi.generator'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.keycloak:keycloak-admin-client:21.1.2'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.20'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.3.0'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$projectDir/src/main/resources/api-spec.yaml"
    outputDir = "${layout.buildDirectory.get()}/generated"
    modelPackage = "ru.yandex.practicum.model"
    invokerPackage = "ru.yandex.practicum"
    apiPackage = "ru.yandex.practicum.api"
    cleanupOutput = true
    configOptions = [
            interfaceOnly: "true",
            useSpringBoot3: "true",
            reactive: "true",
            useBeanValidation: "true",
            serializableModel: "true",
            serializationLibrary: "jackson",
            dateLibrary: "java8"
    ]
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', "${layout.buildDirectory.get()}/generated/src/main/java"]
        }
    }
}

compileJava.dependsOn tasks.openApiGenerate

bootJar {
    launchScript()
}