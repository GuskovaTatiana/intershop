
plugins {
    id 'org.springframework.boot'
    id 'org.openapi.generator'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.keycloak:keycloak-admin-client:21.1.2'
//    implementation 'org.keycloak:keycloak-spring-security-adapter'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'org.springframework.session:spring-session-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6:3.1.2.RELEASE'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.20'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.3.0'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.postgresql:r2dbc-postgresql:1.0.7.RELEASE'
    testRuntimeOnly "io.r2dbc:r2dbc-h2"
    testImplementation 'org.jsoup:jsoup:1.21.2'
    testImplementation 'org.projectlombok:lombok:1.18.28'
    testImplementation 'org.springframework.security:spring-security-test'
}

// Генерация клиентского кода
openApiGenerate {
    generatorName = "java"
    inputSpec = "$rootDir/payment-service/src/main/resources/api-spec.yaml"
    outputDir = "${layout.buildDirectory.get()}/generated"
    modelPackage = "ru.yandex.practicum.model"
    invokerPackage = "ru.yandex.practicum"
    apiPackage = "ru.yandex.practicum.api"
    configOptions = [
            java8: "true",
            dateLibrary: "java8",
            useJakartaEe: "true",
            library: "webclient",
            useSpringBoot3: "true",
            reactive: "true",
            serializableModel: "true",
            serializationLibrary: "jackson",
            useBeanValidation: "true",
            dateLibrary: "java8"
    ]
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', "${layout.buildDirectory.get()}/generated/src/main/java"]
        }
    }
}

compileJava.dependsOn tasks.openApiGenerate

bootJar {
    launchScript()
}