import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

plugins {
    id 'org.springframework.boot'
    id 'org.openapi.generator'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.20'
//    implementation 'org.openapitools:jackson-databind-nullable'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.3.0'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.postgresql:r2dbc-postgresql:1.0.7.RELEASE'
    testRuntimeOnly "io.r2dbc:r2dbc-h2"
    testImplementation 'org.jsoup:jsoup:1.21.2'
}

// Генерация клиентского кода
openApiGenerate {
    generatorName = "java"
    inputSpec = "$rootDir/payment-service/src/main/resources/api-spec.yaml"
    outputDir = "${layout.buildDirectory.get()}/generated"
    modelPackage = "ru.yandex.practicum.internet_shop.client.model"
    apiPackage = "ru.yandex.practicum.internet_shop.client.api"
    configOptions = [
            library: "webclient",
            useSpringBoot3: "true",
            reactive: "true",
            serializableModel: "true",
            serializationLibrary: "jackson",
            dateLibrary: "java8"
    ]
}

sourceSets {
    main {
        java {
            srcDirs += "${layout.buildDirectory.get()}/build/generated"
        }
    }
}

compileJava.dependsOn tasks.openApiGenerate
//compileJava.dependsOn tasks.buildClient

bootJar {
    launchScript()
}