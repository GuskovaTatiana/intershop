server:
  port: 8006
  netty:
    idle-timeout: 60s                     # Закрытие неактивных соединений через 60 секунд
    connection-timeout: 30s               # Тайм-аут установки соединения
    max-connections: 10000                # Максимальное количество одновременных соединений
    validate-headers: true                # Проверка HTTP-заголовков
spring:
  session:
    store-type: redis
    redis:
      flush-mode: on_save
      namespace: spring:session
  application:
    name: internet-shop
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  cache:
    redis:
      time-to-live: PT1S    # TTL по умолчанию для кешей
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    pool:
      enabled: true
      initial-size: 5
      max-size: 15
      max-idle-time: 30s
      max-life-time: 10m
      validation-query: SELECT 1
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: storefront-app
            client-secret: your-client-secret
            authorization-grant-type: authorization_code
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: http://localhost:8081/realms/Ecommerce-Realm
  sql:
    init:
      mode: always
keycloak:
  auth-server-url: http://localhost:8080
  realm: master
  client-id: payment-service
  client-secret: YOUR_CLIENT_SECRET
  grant-type: client_credentials
