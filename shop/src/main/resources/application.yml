server:
  port: 8006
  netty:
    idle-timeout: 60s                     # Закрытие неактивных соединений через 60 секунд
    connection-timeout: 30s               # Тайм-аут установки соединения
    max-connections: 10000                # Максимальное количество одновременных соединений
    validate-headers: true                # Проверка HTTP-заголовков
spring:
  session:
    store-type: redis
    redis:
      flush-mode: on_save
      namespace: spring:session
  application:
    name: internet-shop
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  cache:
    redis:
      time-to-live: PT1S    # TTL по умолчанию для кешей
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    pool:
      enabled: true
      initial-size: 5
      max-size: 15
      max-idle-time: 30s
      max-life-time: 10m
      validation-query: SELECT 1
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: shop-client
            client-secret: gkX8WjEwWFioxxjtXXNVuXZJqCxiWT6R
            authorization-grant-type: authorization_code
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8007}/realms/ecommerce-realm

  sql:
    init:
      mode: always

  # Межсерверные вызовы
payment-service:
  url: ${PAYMENT_SERVICE_URL:http://localhost:8009}
  oauth2:
    client-id: shop-to-payment
    client-secret: h8TCTNMIyhtWU43FkCk1pnofyxCnOMnP
    token-uri: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8007}/realms/ecommerce-realm/protocol/openid-connect/token

